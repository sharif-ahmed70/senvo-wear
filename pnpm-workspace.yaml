packages:
  - apps/*
  - packages/*
overrides:
  "@hono/node-server": 2.0.10
  brace-expansion: 5.0.12
  browserslist: 4.28.9
  deepmerge-ts: 8.0.1
  fast-uri: 3.1.8
  "minimatch@3.1.5": 10.2.5
  mysql2: 3.23.1
  postcss: 8.5.23
  sharp: 0.35.5
  source-map-js: 1.2.2
  nanoid: 3.3.18
  valibot: 1.4.2
  hono: 4.13.13
  vite: 8.1.6
allowBuilds:
  "@prisma/engines": true
  prisma: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.10.2"
  - "@turbo/darwin-arm64@2.10.2"
  - "@turbo/linux-64@2.10.2"
  - "@turbo/linux-arm64@2.10.2"
  - "@turbo/windows-64@2.10.2"
  - "@turbo/windows-arm64@2.10.2"
  - turbo@2.10.2
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 (deep-pattern DoS). Only reached through ESLint tooling
    # (eslint-config-next > fast-glob > micromatch), never shipped or run on
    # user input, and no patched release exists yet. Remove when 3.0.4 ships.
    - GHSA-vfj7-8cjw-p6xm
