services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: senvo_wear_test
      POSTGRES_PASSWORD: senvo_test_password
      POSTGRES_USER: senvo_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senvo_test -d senvo_wear_test"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "55432:5432"
    volumes:
      - senvo-postgres-test:/var/lib/postgresql/data

volumes:
  senvo-postgres-test:
